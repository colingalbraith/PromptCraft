name: Tests

on:
  push:
    branches: [main, Development]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The live Ollama test skips itself when no local server is running
      - run: node --test
      - run: node scripts/package.js
